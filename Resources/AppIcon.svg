<svg xmlns="http://www.w3.org/2000/svg"
     width="1024" height="1024" viewBox="0 0 1024 1024"
     role="img" aria-labelledby="title desc">
  <title id="title">Snowpine Cue</title>
  <desc id="desc">
    A dark rounded tile with a camera notch above three script
    lines, a blue active word, and subtle mountain ridges at the base.
  </desc>

  <defs>
    <clipPath id="tile">
      <rect x="100" y="100" width="824" height="824" rx="186"/>
    </clipPath>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="186"
        fill="#000000"/>

  <g clip-path="url(#tile)">
    <!-- Camera housing joins the top edge. -->
    <path d="M336 100H688V212
             Q688 276 624 276H400
             Q336 276 336 212Z"
          fill="#333333"/>
    <circle cx="512" cy="186" r="30" fill="#00A3E0"/><circle cx="512" cy="186" r="11" fill="#000000"/>

    <!-- Script immediately beneath the camera. -->
    <rect x="300" y="340" width="424" height="64" rx="24"
          fill="#A6A6A6"/>

    <!-- The active word is a distinct blue segment. -->
    <rect x="244" y="460" width="168" height="72" rx="24"
          fill="#00A3E0"/>
    <rect x="444" y="460" width="336" height="72" rx="24"
          fill="#FFFFFF"/>

    <rect x="300" y="588" width="424" height="64" rx="24"
          fill="#A6A6A6"/>

    <!-- Quiet brand motif, confined to the base. -->
    <path d="M100 842L294 760L438 820L626 744
             L924 850V924H100Z"
          fill="#333333"/>
    <path d="M100 890L350 832L518 878L724 810
             L924 880V924H100Z"
          fill="#141414"/>

    <!-- Clipping keeps the outline inside the original tile. -->
    <rect x="100" y="100" width="824" height="824" rx="186"
          fill="none" stroke="#5C5C5C" stroke-width="16"/>
  </g>
</svg>
