name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - name: Unit tests, no-network check, smoke test
        run: scripts/test.sh
      - name: Build the signed app bundle
        run: scripts/build-app.sh
      - name: Launch check (sandboxed app starts, loads the welcome script, quits)
        run: build/EyeCue.app/Contents/MacOS/EyeCue --launch-check
