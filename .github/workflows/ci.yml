name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - name: Unit tests, no-network check, smoke test
        run: scripts/test.sh
      - name: Build the signed app bundle
        run: scripts/build-app.sh
      - name: Launch check (sandboxed app starts, loads the welcome script, quits)
        run: build/EyeCue.app/Contents/MacOS/EyeCue --launch-check
